# Publish release assets from a 1.2.3-style tag (single-branch workflow):
#   libra-desktop-{rid}-{tag}.zip        per-platform desktop payload bundle
#                                        (self-contained server + console web/
#                                        + version.json) consumed by the
#                                        Electron shell's Check Update
#   libra-webapp-{tag}.zip               console SPA static build (also the
#                                        shell's silent web update source)
#   libra-service-{rid}-{tag}.zip        self-contained server, no SPA (cloud)
#   libra-mobile-android-{abi}-{tag}.apk MAUI app (Android), one APK per ABI
#   (optional) Apple mobile assets       iOS .ipa / macOS .app zip; only when
#                                        workflow_dispatch sets build_apple=true
#                                        (they need Apple signing secrets)
# rid = win-x64 | win-arm64 | linux-x64 | linux-arm64
# abi = arm64 | x64
# Every artifact ships with a sibling .sha256. Agent templates are published by
# templates.yml on the same tag.
# Trigger: pushing a tag (1.2.3) or workflow_dispatch with an optional tag_name.

name: Publish Release Assets

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish under (default: current git ref)'
        required: false
      build_apple:
        description: 'Also build the iOS / macOS mobile app (requires Apple signing secrets)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  assets:
    name: server bundles (4 RID) + webapp
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/console/package-lock.json

      - name: Build console SPA
        working-directory: src/console
        run: |
          npm ci
          npm run build

      - name: Publish server (${{ matrix.rid }}, self-contained, single file)
        run: |
          dotnet publish src/LibraNextgen.Server/LibraNextgen.Server.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false \
            -p:EnableCompressionInSingleFile=true \
            -o stage

      - name: Assemble zips + sha256
        shell: bash
        run: |
          set -euo pipefail
          # Windows backend binary carries .exe; linux/mac do not.
          if [[ "${{ matrix.rid }}" == win-* ]]; then BIN="LibraNextgen.Server.exe"; else BIN="LibraNextgen.Server"; fi
          mkdir -p assets out/bundle out/service
          cp -a stage/. out/bundle/
          rm -rf out/bundle/web
          cp -a src/console/dist/. out/bundle/web/
          printf '{"tag":"%s","backend":"%s","port":5270,"webRoot":"web"}\n' \
            "$TAG" "$BIN" > out/bundle/version.json
          cp -a stage/. out/service/
          (cd out/bundle  && zip -qr ../../assets/libra-desktop-${{ matrix.rid }}-$TAG.zip .)
          (cd out/service && zip -qr ../../assets/libra-service-${{ matrix.rid }}-$TAG.zip .)
          cd assets
          sha256sum libra-desktop-${{ matrix.rid }}-$TAG.zip | awk '{print $1}' > libra-desktop-${{ matrix.rid }}-$TAG.zip.sha256
          sha256sum libra-service-${{ matrix.rid }}-$TAG.zip | awk '{print $1}' > libra-service-${{ matrix.rid }}-$TAG.zip.sha256
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.rid }}
          path: assets
          retention-days: 1

  webapp:
    name: webapp zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/console/package-lock.json
      - name: Build console SPA
        working-directory: src/console
        run: |
          npm ci
          npm run build
      - name: Zip + sha256
        shell: bash
        run: |
          mkdir -p assets
          # src/console/dist is three levels under the workspace; use an
          # absolute target so the zip lands in the workspace assets dir.
          (cd src/console/dist && zip -qr "$GITHUB_WORKSPACE/assets/libra-webapp-$TAG.zip" .)
          cd assets
          sha256sum libra-webapp-$TAG.zip | awk '{print $1}' > libra-webapp-$TAG.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-webapp
          path: assets
          retention-days: 1

  electron:
    name: electron installers (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: win
            arch: x64
            rid: win-x64
          - runner: windows-latest
            os: win
            arch: arm64
            rid: win-arm64
          - runner: ubuntu-24.04
            os: linux
            arch: x64
            rid: linux-x64
          - runner: ubuntu-24.04
            os: linux
            arch: arm64
            rid: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      - name: Build console SPA (baseline-web)
        working-directory: src/console
        run: |
          npm ci
          npm run build

      - name: Publish server ${{ matrix.rid }} (baseline-service)
        shell: bash
        run: |
          dotnet publish src/LibraNextgen.Server/LibraNextgen.Server.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false \
            -p:EnableCompressionInSingleFile=true \
            -o desktop/baseline-service

      - name: Stage baseline-web
        shell: bash
        run: |
          rm -rf desktop/baseline-web
          cp -a src/console/dist desktop/baseline-web

      - name: Install shell dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Stamp app version from tag
        working-directory: desktop/electron
        # ${{ env.TAG }} (not $TAG) so it works under both bash and pwsh;
        # --allow-same-version keeps the step idempotent.
        run: npm version "${{ env.TAG }}" --no-git-tag-version --allow-same-version

      - name: Build installer (${{ matrix.os }} ${{ matrix.arch }})
        working-directory: desktop/electron
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "win" ]; then
            npx electron-builder --win nsis --${{ matrix.arch }}
          else
            npx electron-builder --linux AppImage --${{ matrix.arch }}
          fi

      - name: Collect installer artifact
        shell: bash
        run: |
          mkdir -p release-installers
          if [ "${{ matrix.os }}" = "win" ]; then
            mv desktop/electron/release/*Setup*.exe release-installers/libra-desktop-installer-${{ matrix.os }}-${{ matrix.arch }}.exe
          else
            mv desktop/electron/release/*.AppImage release-installers/libra-desktop-installer-${{ matrix.os }}-${{ matrix.arch }}.AppImage
          fi
          ls -la release-installers

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-electron-${{ matrix.os }}-${{ matrix.arch }}
          path: release-installers
          retention-days: 1

  mobile-android:
    name: mobile app (android-${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            rid: android-arm64
          - abi: x64
            rid: android-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/console/package-lock.json

      # The mobile app embeds the console, so the SPA has to exist first; the
      # maui project's own build step then packs it into Resources/Raw.
      - name: Build console SPA
        working-directory: src/console
        run: |
          npm ci
          npm run build

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      # Directory.Build.targets supplies the ASP.NET Core *shared framework* to
      # the Android target (there is no runtime pack for mobile RIDs). The SDK
      # ships it, but fail loudly here instead of with a confusing LIBRA001 later.
      #
      # Ask dotnet where the framework is rather than deriving the path from the
      # executable: `command -v dotnet` says nothing about the layout, and taking
      # dirname twice from /usr/share/dotnet/dotnet lands on /usr/share.
      - name: Verify ASP.NET Core shared framework is present
        shell: bash
        run: |
          set -euo pipefail
          if ! dotnet --list-runtimes | grep -q '^Microsoft.AspNetCore.App '; then
            echo "The ASP.NET Core shared framework is not installed for this SDK."
            echo "Installed runtimes:"
            dotnet --list-runtimes
            exit 1
          fi
          dotnet --list-runtimes | grep '^Microsoft.AspNetCore.App '

      # versionCode must be a monotonically increasing integer; derive it from the
      # tag so a release and its APK never disagree.
      - name: Derive Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${TAG%%-*}"
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Publish APK (${{ matrix.abi }})
        working-directory: maui/LibraNextgen.Mobile
        run: |
          dotnet publish -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:RuntimeIdentifier=${{ matrix.rid }} \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.name }} \
            -p:ApplicationVersion=${{ steps.version.outputs.code }}

      - name: Collect APK + sha256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          src=$(ls maui/LibraNextgen.Mobile/bin/Release/net10.0-android/${{ matrix.rid }}/publish/*-Signed.apk)
          out=assets/libra-mobile-android-${{ matrix.abi }}-$TAG.apk
          cp "$src" "$out"
          (cd assets && sha256sum "$(basename "$out")" | awk '{print $1}' > "$(basename "$out").sha256")
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-mobile-android-${{ matrix.abi }}
          path: assets
          retention-days: 1

  # Apple platforms are opt-in (workflow_dispatch → build_apple): they only
  # produce an installable artifact with a signing identity and provisioning
  # profile, which the repository cannot assume. See docs/ for the secret names.
  mobile-apple:
    name: mobile app (apple)
    if: ${{ github.event.inputs.build_apple == 'true' }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            tfm: net10.0-ios
          - platform: maccatalyst
            tfm: net10.0-maccatalyst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/console/package-lock.json

      - name: Build console SPA
        working-directory: src/console
        run: |
          npm ci
          npm run build

      - name: Install MAUI Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst --skip-sign-check

      # Runs unconditionally and no-ops without secrets: `if:` cannot reliably
      # read secrets, and an unsigned build is still useful for smoke testing.
      - name: Import signing identity
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12:-}" ]; then
            echo "No Apple signing secrets configured; continuing unsigned."
            exit 0
          fi
          keychain=build.keychain
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p actions "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import cert.p12 -k "$keychain" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/libra.mobileprovision

      # TargetFrameworks is overridden here because the project ships Android-only
      # by default; the same sources build for Apple unchanged.
      - name: Publish ${{ matrix.platform }}
        working-directory: maui/LibraNextgen.Mobile
        run: |
          dotnet publish -f ${{ matrix.tfm }} -c Release \
            -p:TargetFrameworks=${{ matrix.tfm }} \
            -p:ApplicationDisplayVersion=$TAG \
            -p:ApplicationVersion=1

      - name: Collect artifact + sha256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base=maui/LibraNextgen.Mobile/bin/Release/${{ matrix.tfm }}
          if [ "${{ matrix.platform }}" = "ios" ]; then
            # An unsigned build still yields the .app bundle; an .ipa needs signing.
            if ls "$base"/*/publish/*.ipa >/dev/null 2>&1; then
              cp "$base"/*/publish/*.ipa "assets/libra-mobile-ios-$TAG.ipa"
            else
              echo "No .ipa produced - Apple signing secrets are required"; exit 1
            fi
          else
            (cd "$base" && zip -qry "$GITHUB_WORKSPACE/assets/libra-mobile-macos-$TAG.zip" *.app)
          fi
          (cd assets && for f in *; do sha256sum "$f" | awk '{print $1}' > "$f.sha256"; done)
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-mobile-${{ matrix.platform }}
          path: assets
          retention-days: 1

  attach:
    name: Attach to release
    needs: [assets, webapp, electron, mobile-android, mobile-apple]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Abort when any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "asset build failed - nothing published"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            release-assets/libra-desktop-*.zip
            release-assets/libra-desktop-*.zip.sha256
            release-assets/libra-service-*.zip
            release-assets/libra-service-*.zip.sha256
            release-assets/libra-webapp-*.zip
            release-assets/libra-webapp-*.zip.sha256
            release-assets/libra-desktop-installer-*
            release-assets/libra-mobile-android-*
          fail_on_unmatched_files: true

      # Separate step: the Apple artifacts only exist on an opt-in dispatch run.
      - uses: softprops/action-gh-release@v2
        if: ${{ github.event.inputs.build_apple == 'true' }}
        with:
          tag_name: ${{ env.TAG }}
          files: |
            release-assets/libra-mobile-ios-*
            release-assets/libra-mobile-macos-*
          fail_on_unmatched_files: true
