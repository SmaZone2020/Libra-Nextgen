name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET (service + common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build src/service.sln -c Release
      - run: dotnet test src/tests/LibraNextgen.Tests/LibraNextgen.Tests.csproj -c Release --no-build

  webapp:
    name: Webapp (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/webapp/package-lock.json
      - run: npm ci
      - run: npm run build
