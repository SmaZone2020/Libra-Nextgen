name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (agent-rs)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/agent-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  dotnet:
    name: .NET (Server + Common)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      LIBRA_TEST_MONGO: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Libra-Nextgen.sln -c Release
      - run: dotnet format Libra-Nextgen.sln --verify-no-changes --no-restore --diagnostics WHITESPACE,FORMAT
      - run: dotnet test src/tests/LibraNextgen.Tests/LibraNextgen.Tests.csproj -c Release --no-build

  console:
    name: Console (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
