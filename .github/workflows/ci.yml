name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (agent-rs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agent-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets

  dotnet:
    name: .NET (service + common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build src/service.sln -c Release
      - run: dotnet test src/tests/LibraNextgen.Tests/LibraNextgen.Tests.csproj -c Release

  webapp:
    name: Webapp (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
