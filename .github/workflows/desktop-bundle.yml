# Publish the desktop bundle (self-contained server + console SPA) used by the
# desktop-branch WPF shell. Release contract documented in desktop/README.md:
#   libra-desktop-win-x64-{tag}.zip          root: version.json | server exe | web/
#   libra-desktop-win-x64-{tag}.zip.sha256   hex digest (the shell refuses zips without it)
# Trigger: pushing a tag (1.2.3) or workflow_dispatch with an optional tag_name.

name: Publish Desktop Bundle

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish under (default: current git ref)'
        required: false

permissions:
  contents: write

jobs:
  bundle:
    name: Desktop bundle win-x64
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/console/package-lock.json

      - name: Build console SPA
        working-directory: src/console
        run: |
          npm ci
          npm run build

      - name: Publish self-contained server (win-x64, single file)
        run: |
          dotnet publish src/LibraNextgen.Server/LibraNextgen.Server.csproj \
            -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false \
            -o bundle-publish

      - name: Assemble bundle zip + sha256
        shell: bash
        run: |
          set -euo pipefail
          STAGE=bundle-content
          rm -rf "$STAGE"
          mkdir -p "$STAGE/web"
          # Copy the whole publish dir: single-file exe plus appsettings.json,
          # Configuration/ and Profiles/ needed at runtime next to the exe.
          cp -a bundle-publish/. "$STAGE/"
          cp -a src/console/dist/. "$STAGE/web/"
          printf '{"tag":"%s","backend":"LibraNextgen.Server.exe","port":5270,"webRoot":"web"}\n' \
            "$TAG" > "$STAGE/version.json"
          (cd "$STAGE" && zip -qr "../libra-desktop-win-x64-$TAG.zip" .)
          sha256sum "libra-desktop-win-x64-$TAG.zip" \
            | awk '{print $1}' > "libra-desktop-win-x64-$TAG.zip.sha256"
          ls -la "libra-desktop-win-x64-$TAG.zip"*
          echo "--- bundle layout ---"
          unzip -l "libra-desktop-win-x64-$TAG.zip" | head -20

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            libra-desktop-win-x64-${{ env.TAG }}.zip
            libra-desktop-win-x64-${{ env.TAG }}.zip.sha256
          fail_on_unmatched_files: true