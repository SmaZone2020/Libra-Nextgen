[workspace]
members = [
    "libra-common",
    "libra-crypto",
    "libra-comm",
    "libra-syscalls",
    "libra-platform",
    "libra-modules",
    "libra-engine",
    "libra-load",
    "libra-psinline",
    "agent",
    "loader",
    "core",
    "srdi",
    "modules/shell",
    "modules/recon",
    "modules/creds",
    "modules/files",
    "modules/powershell",
    "modules/proxy",
    "modules/script",
    "modules/token",
    "modules/forkexec",
    "plugins/qqkey",
    "plugins/aitoken",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
reqwest = { version = "0.12", features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate", "stream"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["__rustls-tls"] }
futures-util = "0.3"
sysinfo = "0.33"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
regex = "1"
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Devices_Enumeration",
    "Media_Capture",
    "Media_MediaProperties",
    "Storage",
    "Storage_Streams",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Advertisement",
    "Devices_Radios",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
] }
portable-pty = "0.9"
rquickjs = { version = "0.8", features = ["full"] }

[profile.release]
strip = true
lto = "fat"
opt-level = 2
panic = "abort"
codegen-units = 1
