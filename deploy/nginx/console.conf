# Libra-Nextgen nginx site config (single-port deployment).
# SPA root: /usr/share/nginx/html (console dist, mounted read-only from the server container).
# Key points (matches docs/deployment.md §4):
#   · SSE requires proxy_buffering off + read/send timeout > 30s keepalive
#   · /ws/console requires WebSocket upgrade support
#   · large bodies (module results / plugin zips) need >= 64m

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── API / beacon / MCP / docs (proxy to server) ──────────────────────
    location /api/ {
        proxy_pass http://server:5270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # SSE event stream (30s keepalive)
        proxy_send_timeout 120s;
        proxy_buffering off;          # required for SSE
    }

    # Agent malleable channel (default profile style)
    location /v1/chat/completions {
        proxy_pass http://server:5270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Console realtime push (WebSocket)
    location /ws/console {
        proxy_pass http://server:5270;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # MCP (Streamable HTTP, SSE responses)
    location /mcp {
        proxy_pass http://server:5270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /scalar {
        proxy_pass http://server:5270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # SPA fallback for everything else
    location / {
        try_files $uri $uri/ /index.html;
    }
}

